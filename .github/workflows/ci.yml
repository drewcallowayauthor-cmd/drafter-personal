name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Export coverage summary
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -maxdepth 1 | head -n 1)
          BINARY_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
          xcrun llvm-cov report "$BINARY_PATH" \
            -instr-profile="$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex=".build|Tests" || true

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict
